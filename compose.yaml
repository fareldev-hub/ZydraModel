services:
  zydra:
    build:
      context: .
    image: zydra-text
    container_name: zydra
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MODEL_PATH: ${MODEL_PATH:-/app/model/zydra-loRa.gguf}
      MODEL_SERVER_URL: ${MODEL_SERVER_URL:-http://llama:8080}
      AUTH_FILE: ${AUTH_FILE:-/data/auth}
      API_KEYS_FILE: ${API_KEYS_FILE:-/data/database/api.json}
    ports:
      - "${HOST_PORT:-8000}:8000"
    volumes:
      - ./model:/app/model:ro
      - zydra-data:/data
    depends_on:
      - llama

  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: zydra-llama
    restart: unless-stopped
    command:
      - -m
      - /models/zydra-loRa.gguf
      - --mmproj
      - /models/mmproj-zydra-loRa.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --alias
      - zydra-loRa
      - --ctx-size
      - "${MODEL_CONTEXT_SIZE:-2048}"
      - --threads
      - "${MODEL_THREADS:-4}"
      - --no-mmproj-offload
    volumes:
      - ./model:/models:ro

volumes:
  zydra-data: