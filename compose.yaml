services:
  zydra:
    build:
      context: .
    image: zydra-text
    container_name: zydra
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AUTH_FILE: ${AUTH_FILE:-/data/auth}
      API_KEYS_FILE: ${API_KEYS_FILE:-/data/database/api.json}
      HF_HOME: ${HF_HOME:-/data/model-cache}
      HF_MODEL_REPO: "${HF_MODEL_REPO:-ggml-org/SmolVLM2-500M-Video-Instruct-GGUF:Q8_0}"
      RUN_LOCAL_MODEL: "true"
    ports:
      - "${HOST_PORT:-8000}:8000"
    volumes:
      - zydra-data:/data
      - llama-model-cache:/data/model-cache

volumes:
  zydra-data:
  llama-model-cache: